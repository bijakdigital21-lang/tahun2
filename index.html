<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Kuiz & Pembetulan</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      color: #333;
      padding: 20px;
      margin: 0;
    }
    .kuiz-container {
      max-width: 650px;
      margin: 0 auto;
      background: #fff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 30px;
    }
    .kad-soalan {
      background: #fafafa;
      padding: 20px;
      border-radius: 6px;
      margin-bottom: 20px;
      border-left: 5px solid #3498db;
      transition: all 0.3s ease;
    }
    /* Warna Status Mod Pembetulan */
    .kad-soalan.betul {
      border-left-color: #2ecc71;
      background: #ebf9eb;
    }
    .kad-soalan.salah {
      border-left-color: #e74c3c;
      background: #fdf2f2;
    }
    .teks-soalan {
      font-weight: 600;
      font-size: 1.1rem;
      margin-bottom: 15px;
    }
    .pilihan-jawapan {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .label-pilihan {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .label-pilihan:hover {
      background: #f0f0f0;
    }
    input[type="radio"] {
      transform: scale(1.2);
    }
    .butang-utama {
      display: block;
      width: 100%;
      padding: 12px;
      background: #3498db;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
    }
    .butang-utama:hover {
      background: #2980b9;
    }
    /* Bahagian Keputusan */
    .papan-markah {
      display: none;
      background: #2c3e50;
      color: #fff;
      padding: 20px;
      border-radius: 6px;
      text-align: center;
      margin-bottom: 25px;
    }
    .papan-markah h2 {
      margin: 0 0 10px 0;
    }
    .status-notifikasi {
      font-weight: bold;
      margin-top: 10px;
      font-size: 0.95rem;
    }
    .teks-hijau { color: #27ae60; }
    .teks-merah { color: #c0392b; }
    .tutup { display: none !important; }
  </style>
</head>
<body>

<div class="kuiz-container">
  <h1>Kuiz Uji Minda</h1>

  <!-- Papan Markah Asal (Dipaparkan selepas hantar) -->
  <div id="papanMarkah" class="papan-markah">
    <h2>Keputusan Kuiz</h2>
    <p id="teksMarkah" style="font-size: 1.5rem; font-weight: bold; margin: 0;"></p>
    <p style="font-size: 0.9rem; color: #bdc3c7; margin-top: 5px;">*Markah ini telah dikunci dan tidak akan berubah semasa pembetulan.</p>
  </div>

  <!-- Tempat Soalan Di-generate -->
  <div id="ruanganSoalan"></div>

  <!-- Butang Hantar -->
  <button id="btnHantar" class="butang-utama" onclick="hantarKuiz()">Hantar Jawapan</button>
</div>

<script>
  // 1. Data Bank Soalan (Anda boleh ubah/tambah soalan di sini)
  const bankSoalan = [
    { id: 1, soalan: "Apakah ibu negara Malaysia?", pilihan: ["Shah Alam", "Kuala Lumpur", "Penang"], jawapanBetul: "Kuala Lumpur" },
    { id: 2, soalan: "Berapakah hasil tambah 2 + 3?", pilihan: ["4", "5", "6"], jawapanBetul: "5" },
    { id: 3, soalan: "Berapakah bilangan jalur pada bendera Malaysia?", pilihan: ["12", "14", "16"], jawapanBetul: "14" }
  ];

  // 2. State Pengurusan Data
  let jawapanAsal = {};
  let markahAsal = 0;
  let modPembetulan = false;

  // 3. Papar Soalan Pertama Kali Luar Talian
  function janaSoalan() {
    const ruangan = document.getElementById("ruanganSoalan");
    ruangan.innerHTML = "";

    bankSoalan.forEach((s, indeks) => {
      let pilihanHTML = "";
      
      s.pilihan.forEach(pilihan => {
        pilihanHTML += `
          <label class="label-pilihan">
            <input type="radio" name="soalan_${s.id}" value="${pilihan}" onchange="simpanJawapan(${s.id}, '${pilihan}')">
            ${pilihan}
          </label>
        `;
      });

      ruangan.innerHTML += `
        <div class="kad-soalan" id="kad_${s.id}">
          <div class="teks-soalan">${indeks + 1}. ${s.soalan}</div>
          <div class="pilihan-jawapan">
            ${pilihanHTML}
          </div>
          <div id="notif_${s.id}" class="status-notifikasi"></div>
        </div>
      `;
    });
  }

  // 4. Simpan jawapan sementara ketika user klik radio button
  function simpanJawapan(soalanId, nilai) {
    if (!modPembetulan) {
      jawapanAsal[soalanId] = nilai;
    } else {
      // Jika dalam mod pembetulan, proses perubahan secara terus
      semakPembetulanSpesifik(soalanId, nilai);
    }
  }

  // 5. Fungsi Hantar Kuiz (Klik Butang Utama)
  function hantarKuiz() {
    // Pastikan semua soalan dijawab dahulu
    let semuaDijawab = true;
    bankSoalan.forEach(s => {
      if (!jawapanAsal[s.id]) semuaDijawab = false;
    });

    if (!semuaDijawab) {
      alert("Sila jawab semua soalan sebelum menghantar!");
      return;
    }

    // Kira Markah Asal
    markahAsal = 0;
    bankSoalan.forEach(s => {
      if (jawapanAsal[s.id] === s.jawapanBetul) {
        markahAsal++;
      }
    });

    // Papar Papan Markah Kekal
    document.getElementById("teksMarkah").innerText = `Markah Sebenar: ${markahAsal} / ${bankSoalan.length}`;
    document.getElementById("papanMarkah").style.display = "block";
    
    // Sembunyikan butang hantar kerana kuiz utama sudah selesai
    document.getElementById("btnHantar").classList.add("tutup");

    // Aktifkan Mod Pembetulan
    modPembetulan = true;
    tukarKeModPembetulan();
  }

  // 6. Kemas Kini UI untuk Fasa Pembetulan
  function tukarKeModPembetulan() {
    bankSoalan.forEach(s => {
      const kad = document.getElementById(`kad_${s.id}`);
      const notif = document.getElementById(`notif_${s.id}`);
      const betul = jawapanAsal[s.id] === s.jawapanBetul;

      if (betul) {
        kad.classList.add("betul");
        notif.innerHTML = `<span class="teks-hijau">✓ Betul! (Jawapan: ${s.jawapanBetul})</span>`;
        
        // Kunci input supaya soalan yang betul tidak diusik lagi
        const inputs = document.getElementsByName(`soalan_${s.id}`);
        inputs.forEach(input => input.disabled = true);
      } else {
        kad.classList.add("salah");
        notif.innerHTML = `<span class="teks-merah">✗ Salah. Jawapan asal anda: "${jawapanAsal[s.id]}". Sila buat pembetulan.</span>`;
      }
    });
  }

  // 7. Semakan Real-time semasa pengguna menukar jawapan yang salah
  function semakPembetulanSpesifik(soalanId, nilaiBaharu) {
    const soalan = bankSoalan.find(s => s.id === soalanId);
    const kad = document.getElementById(`kad_${soalanId}`);
    const notif = document.getElementById(`notif_${soalanId}`);

    if (nilaiBaharu === soalan.jawapanBetul) {
      kad.className = "kad-soalan betul"; // Tukar tema kad jadi hijau
      notif.innerHTML = `<span class="teks-hijau">✓ Pembetulan Berjaya! Sekarang jawapan anda sudah BETUL.</span>`;
    } else {
      kad.className = "kad-soalan salah"; // Kekal tema merah
      notif.innerHTML = `<span class="teks-merah">✗ Pembetulan Salah. Pilihan "${nilaiBaharu}" masih tidak tepat. Sila cuba lagi.</span>`;
    }
  }

  // Jalankan fungsi jana kuiz sebaik fail dibuka
  janaSoalan();
</script>

</body>
</html>
